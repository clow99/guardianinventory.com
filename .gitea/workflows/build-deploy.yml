name: CI Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  smoke-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run dev smoke tests (next dev)
        env:
          SMOKE_ALLOW_500: '1'
        run: npm run test:smoke:dev

  build:
    runs-on: ubuntu-latest
    needs: smoke-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run auth guard tests
        run: npm run test:auth

      - name: Build (runs smoke tests)
        env:
          SMOKE_ALLOW_500: '1'
        run: npm run build

      - name: List .next build output
        run: ls -la .next || true

      - name: Install Docker and Docker Compose
        run: |
          sudo apt update
          sudo apt install -y docker-compose

      - name: Check Docker and Compose versions
        run: |
          docker --version
          docker-compose --version

      - name: Build Docker image with docker-compose
        run: docker-compose build

      - name: List Docker images
        run: docker images

      - name: Tag Docker image (live)
        run: docker tag guardian:latest localhost:5000/guardian:live

      - name: Push Docker image (live)
        run: docker push localhost:5000/guardian:live
