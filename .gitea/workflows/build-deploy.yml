name: Build and Deploy Next.js App

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: ⏬ Checkout repository
              uses: actions/checkout@v2

            - name: 🔎 Confirm codebase files present
              run: |
                  ls -la
                  echo "Repository files listed above."

            - name: 🛠️ Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20.9.0"

            - name: 🧹 Clean previous Node modules (if any)
              run: |
                  echo "Cleaning up previous node_modules if exists..."
                  rm -rf node_modules

            - name: 📦 Install dependencies
              run: |
                  echo "Installing dependencies with npm ci..."
                  npm ci --legacy-peer-deps

            - name: ✅ Validate dependencies installed
              run: |
                  echo "Checking installed dependencies..."
                  npm list --depth=0

            - name: ⚡ Run Next.js build
              run: |
                  echo "Building Next.js app..."
                  npm run build

            - name: 📁 List .next build output
              run: |
                  echo "Listing .next directory contents..."
                  ls -la .next

            - name: 🐳 Install Docker and Docker Compose
              run: |
                  echo "Updating apt repositories and installing Docker Compose..."
                  sudo apt update
                  sudo apt install -y docker-compose

            - name: 🛳️ Check Docker and Compose versions
              run: |
                  docker --version
                  docker-compose --version

            - name: 🏗️ Build Docker image with docker-compose
              run: |
                  echo "Starting docker-compose build..."
                  docker-compose build

            - name: 📦 List Docker images
              run: |
                  echo "Listing Docker images..."
                  docker images

            - name: 🏷️ Tag Docker image (live)
              run: |
                  echo "Tagging image as live..."
                  docker tag guardian:latest localhost:5000/guardian:live

            # - name: 🏷️ Tag Docker image (latest)
            #   run: |
            #       echo "Tagging image as latest..."
            #       docker tag guardian:latest localhost:5000/guardian:latest

            - name: 🚚 Push Docker image (live)
              run: |
                  echo "Pushing image: guardian:live"
                  docker push localhost:5000/guardian:live

            # - name: 🚚 Push Docker image (latest)
            #   run: |
            #       echo "Pushing image: guardian:latest"
            #       docker push localhost:5000/guardian:latest

            - name: 🎉 Done!
              run: |
                  echo "✅ All build and deployment steps finished successfully!"
